/* ------------------------------ Small elements ------------------------------ */
function Toggle({ checked, onChange }) {
  return (
    <button type="button" role="switch" aria-checked={checked} onClick={() => onChange(!checked)}
      style={{ position: "relative", display: "inline-flex", alignItems: "center", flexShrink: 0, width: 48, height: 28, borderRadius: 9999, border: "none", padding: 0, cursor: "pointer", transition: "background-color 0.2s ease", backgroundColor: checked ? BRAND_GREEN : "#B9C2B4" }}>
      <span style={{ position: "absolute", top: 2, left: 2, width: 24, height: 24, borderRadius: 9999, backgroundColor: "#fff", boxShadow: "0 1px 2px rgba(0,0,0,0.25)", transition: "transform 0.2s ease", transform: checked ? "translateX(20px)" : "translateX(0px)" }} />
    </button>
  );
}

function Stars({ rating }) {
  return (
    <span className="inline-flex items-center gap-1 text-sm font-semibold" style={{ color: BRAND_AMBER }}>
      <Icon name="Star" size={14} color={BRAND_AMBER} />
      {rating.toFixed(1)}
    </span>
  );
}

function SheetModal({ onClose, children, t }) {
  return (
    <div className="ferdo-anim fixed inset-0 z-50 flex items-end justify-center">
      <div onClick={onClose} className="absolute inset-0 bg-black/45 backdrop-blur-[2px]" style={{ animation: "ferdoFadeIn 0.2s ease-out" }} />
      <div className={`relative w-full max-w-md rounded-t-[28px] border-t ${t.cardBorder} ${t.card} px-5 pb-6 pt-3 max-h-[88vh] overflow-y-auto`}
        style={{ animation: "ferdoSheetUp 0.28s cubic-bezier(0.22,1,0.36,1)" }}>
        <div className={`mx-auto mb-3 h-1.5 w-10 rounded-full ${t.chip}`} />
        {children}
      </div>
    </div>
  );
}

function Toast({ message, t }) {
  return (
    <div className="ferdo-anim fixed left-1/2 top-4 z-[60] -translate-x-1/2" style={{ animation: "ferdoSlideUp 0.25s ease-out" }}>
      <div className={`flex items-center gap-2 rounded-2xl border ${t.cardBorder} ${t.card} px-4 py-3 shadow-lg`}>
        <Icon name="CheckCircle2" size={18} color={BRAND_GREEN} />
        <span className={`text-sm font-medium ${t.text}`}>{message}</span>
      </div>
    </div>
  );
}

      <p className={`mt-1 text-sm ${t.subtext}`}>{subtitle}</p>
    </div>
  );
}

/* ------------------------------ SVG illustrations ---------------------------- */
/* Har bir texnika, yuk mashinasi va ombor o'z rangi va shakliga ega. */
function Wheel({ x, y, r, rim = "#EDEAE0" }) {
  return (
    <g>
      <circle cx={x} cy={y} r={r} fill="#1a1f17" />
      <circle cx={x} cy={y} r={r} fill="none" stroke="#000" strokeOpacity="0.25" strokeWidth="2" />
      <circle cx={x} cy={y} r={r * 0.46} fill={rim} />
      <circle cx={x} cy={y} r={r * 0.16} fill="#3a3a34" />
    </g>
  );
}

function TractorArt({ c }) {
  const R = c.rear || 32, F = c.front || 18;
  return (
    <svg viewBox="0 0 220 140" className="h-full w-full">
      <ellipse cx="110" cy="122" rx="95" ry="8" fill="rgba(0,0,0,0.15)" />
      <rect x="58" y="88" width="112" height="8" rx="3" fill="#1c241a" />
      <Wheel x={158} y={122 - R} r={R} rim={c.rim} />
      <Wheel x={66} y={122 - F} r={F} rim={c.rim} />
      <rect x="40" y="62" width="80" height="30" rx="7" fill={c.body} />
      <rect x="40" y="62" width="80" height="9" rx="4" fill={c.light} />
      {c.stripe && <rect x="40" y="78" width="80" height="4" fill={c.stripe} />}
      <circle cx="38" cy="80" r="6" fill={BRAND_AMBER} />
      <path d="M118 34 L168 34 L178 68 L118 68 Z" fill={c.cab} />
      <path d="M126 40 L162 40 L169 62 L126 62 Z" fill="#BFE0E6" fillOpacity="0.85" />

      {c.dual && <Wheel x={186} y={122 - R * 0.85} r={R * 0.85} rim={c.rim} />}

  );
}

/* ------------------------------ Date + number helpers ------------------------------ */
function localISO(d = new Date()) {
  const p = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
}
function fmtDate(iso, plusDays = 0) {
  const [y, m, d] = (iso || localISO()).split("-").map(Number);
  const dt = new Date(y, m - 1, d + plusDays);
  const p = (n) => String(n).padStart(2, "0");
  return `${p(dt.getDate())}.${p(dt.getMonth() + 1)}.${dt.getFullYear()}`;
}

/* Yozib ham, +/- bilan ham o'zgartiriladigan son maydoni (maydonni tozalab qayta yozish mumkin) */
function NumStepper({ value, onChange, min = 1, max = 9999, unit, t }) {
  const [text, setText] = useState(String(value));
  useEffect(() => { setText(String(value)); }, [value]);
  const commit = (n) => { const c = Math.min(max, Math.max(min, n)); onChange(c); setText(String(c)); };
  const btn = "flex h-11 w-11 shrink-0 items-center justify-center rounded-xl text-xl font-bold text-white disabled:opacity-30 active:opacity-90";
  return (
    <div className={`flex items-center gap-2 rounded-2xl border ${t.cardBorder} ${t.inputBg} p-1.5`}>
      <button type="button" aria-label="Kamaytirish" disabled={value <= min} onClick={() => commit(value - 1)} className={btn} style={{ backgroundColor: BRAND_GREEN }}>−</button>
      <input inputMode="numeric" value={text}
        onChange={(e) => {
          const d = e.target.value.replace(/\D/g, "").slice(0, 5);
          setText(d);
          if (d !== "" && Number(d) >= min) onChange(Math.min(max, Number(d)));
        }}
        onBlur={() => commit(Number(text) || min)}
        className={`min-w-0 flex-1 bg-transparent text-center text-lg font-bold outline-none ${t.text}`} />
      <span className={`text-sm ${t.faint}`}>{unit}</span>
      <button type="button" aria-label="Ko'paytirish" disabled={value >= max} onClick={() => commit(value + 1)} className={btn} style={{ backgroundColor: BRAND_GREEN }}>+</button>
    </div>
  );
}

function QuickChips({ options, value, onPick, unit, t }) {
  return (
    <div className="mt-2 flex flex-wrap gap-2">
      {options.map((o) => {
        const active = value === o;
        return (
          <button key={o} type="button" onClick={() => onPick(o)}
            className={`rounded-full px-3.5 py-1.5 text-xs font-semibold ${active ? "text-white" : `${t.subtext} ${t.chip}`}`}
            style={{ backgroundColor: active ? BRAND_GREEN : undefined }}>{o} {unit}</button>
        );
      })}
    </div>
  );
}

/* --------------------------------- Page 3 --------------------------------- */
function WarehousePage({ t, showToast, addHistory }) {
  const [warehouses, setWarehouses] = useState(INITIAL_WAREHOUSES);
  const [target, setTarget] = useState(null);
  const [tonnage, setTonnage] = useState(10);
  const todayStr = localISO();
  const [startDate, setStartDate] = useState(todayStr);
  const [storageDays, setStorageDays] = useState(30);
  const sorted = useMemo(() => [...warehouses].sort((a, b) => a.distanceKm - b.distanceKm), [warehouses]);

  const openBooking = (w) => { setTarget(w); setTonnage(Math.min(10, w.freeCapacity)); setStartDate(todayStr); setStorageDays(30); };

  const endDateLabel = fmtDate(startDate, storageDays - 1);
  const total = target ? target.pricePerTonDay * tonnage * storageDays : 0;

  const confirmBooking = () => {
    if (!target) return;
    setWarehouses((prev) => prev.map((w) => (w.id === target.id ? { ...w, freeCapacity: Math.max(0, w.freeCapacity - tonnage) } : w)));
    showToast(`${target.name} — ${tonnage} tonna, ${formatSum(total)}`);
    addHistory({ type: "warehouse", title: target.name, subtitle: `${tonnage} tonna · ${fmtDate(startDate)} dan ${storageDays} kunga (${endDateLabel} gacha)`, amount: total });
    setTarget(null);
  };

  return (
    <div>
      <SectionHeader title="Omborxona" subtitle="Sizga eng yaqin omborlar" t={t} />
      <div className="space-y-4 px-5">
        {sorted.map((w) => {
          const pct = Math.round((w.freeCapacity / w.totalCapacity) * 100);
          return (
            <div key={w.id} className={`rounded-2xl border ${t.cardBorder} ${t.card} p-3`}>
              <VisualPanel badge={`${w.distanceKm} km`} photoUrl={w.photo} sky={w.art.sky}><WarehouseArt c={w.art} /></VisualPanel>
              <div className="mt-3 flex items-start justify-between gap-2">
                <div>
                  <h3 className={`text-base font-semibold ${t.text}`}>{w.name}</h3>
                  <p className={`mt-0.5 text-xs ${t.subtext}`}>{w.region}</p>
                  <p className="mt-1 text-sm font-bold" style={{ color: BRAND_GREEN }}>{formatSum(w.pricePerTonDay)} <span className={`text-xs font-normal ${t.faint}`}>/ tonna · kun</span></p>
                </div>
              </div>
              <div className="mt-3">
                <div className="flex items-center justify-between text-xs">
                  <span className={t.subtext}>Bo'sh joy</span>
                  <span className={`font-semibold ${t.text}`}>{w.freeCapacity} / {w.totalCapacity} tonna</span>
                </div>
                <div className={`mt-1.5 h-2 w-full overflow-hidden rounded-full ${t.chip}`}>
                  <div className="h-full rounded-full transition-all duration-500" style={{ width: `${pct}%`, backgroundColor: pct < 25 ? BRAND_SOIL : BRAND_GREEN }} />
                </div>
              </div>
              <button onClick={() => openBooking(w)} disabled={w.freeCapacity <= 0}
                className="mt-3.5 flex w-full items-center justify-center gap-2 rounded-xl py-2.5 text-sm font-semibold text-white disabled:opacity-40 active:opacity-90" style={{ backgroundColor: BRAND_GREEN }}>
                <Icon name="Gauge" size={16} />{w.freeCapacity <= 0 ? "Joy yo'q" : "Bron qilish"}
              </button>
            </div>
          );
        })}
      </div>
      {target && (
        <SheetModal t={t} onClose={() => setTarget(null)}>
          <div className="flex items-center justify-between">
            <h2 className={`text-lg font-bold ${t.text}`}>{target.name}</h2>
            <button onClick={() => setTarget(null)} className={`rounded-full p-1.5 ${t.chip}`}><Icon name="X" size={18} className={t.text} /></button>
          </div>
          <p className={`mt-1 text-sm ${t.subtext}`}>{target.region} · {target.distanceKm} km</p>
          <div className="mt-4">
            <label className={`mb-2 block text-sm font-medium ${t.text}`}>Necha tonna yuk saqlaysiz?</label>
            <NumStepper value={tonnage} onChange={setTonnage} min={1} max={target.freeCapacity} unit="tonna" t={t} />
            <QuickChips options={[5, 10, 20, 50].filter((n) => n <= target.freeCapacity)} value={tonnage} onPick={setTonnage} unit="t" t={t} />
            <p className={`mt-2 text-xs ${t.faint}`}>Bo'sh joy: {target.freeCapacity} tonna. Narx tonna soniga bog'liq, shuning uchun uni kiritish shart.</p>
          </div>
          <div className="mt-4">
            <label className={`mb-2 block text-sm font-medium ${t.text}`}>Qaysi sanadan boshlab?</label>
            <div className={`flex items-center gap-3 rounded-2xl border ${t.cardBorder} ${t.inputBg} px-4 py-3`}>
              <Icon name="Calendar" size={18} className={t.faint} />
              <input type="date" min={todayStr} value={startDate} onChange={(e) => setStartDate(e.target.value || todayStr)}
                className={`w-full bg-transparent text-base font-semibold outline-none ${t.text}`} />
            </div>
          </div>
          <div className="mt-4">
            <label className={`mb-2 block text-sm font-medium ${t.text}`}>Necha kunga saqlaysiz?</label>
            <NumStepper value={storageDays} onChange={setStorageDays} min={1} max={365} unit="kun" t={t} />
            <QuickChips options={[7, 14, 30, 60, 90]} value={storageDays} onPick={setStorageDays} unit="kun" t={t} />
            <p className={`mt-2 text-xs ${t.subtext}`}>Saqlash muddati: <span className={`font-semibold ${t.text}`}>{fmtDate(startDate)} — {endDateLabel}</span></p>
          </div>
          <div className={`mt-5 space-y-1.5 border-t ${t.divider} pt-4`}>
            <div className={`flex items-center justify-between text-sm ${t.subtext}`}>
              <span>Tarif</span>
              <span>{formatSum(target.pricePerTonDay)} / tonna · kun</span>
            </div>
            <div className={`flex items-center justify-between text-sm ${t.subtext}`}>
              <span>{tonnage} tonna × {storageDays} kun</span>
              <span>{tonnage * storageDays} tonna·kun</span>
            </div>
            <div className="flex items-center justify-between pt-1.5">
              <span className={`text-sm font-medium ${t.text}`}>Jami narx</span>
              <span className="text-xl font-extrabold" style={{ color: BRAND_GREEN }}>{formatSum(total)}</span>
            </div>
          </div>
          <button onClick={confirmBooking} className="mt-5 flex w-full items-center justify-center gap-2 rounded-2xl py-3.5 text-base font-semibold text-white active:opacity-90" style={{ backgroundColor: BRAND_GREEN }}>
            <Icon name="Check" size={18} /> Bronni tasdiqlash
          </button>
        </SheetModal>
      )}
    </div>
  );
}

/* --------------------------------- Page 4 --------------------------------- */
const HISTORY_TYPE_META = {
  rental: { label: "Ijara", icon: "Tractor", color: BRAND_GREEN },
  logistics: { label: "Logistika", icon: "Truck", color: BRAND_SOIL },
  warehouse: { label: "Ombor", icon: "Warehouse", color: BRAND_AMBER },
};

function HistoryPage({ t, history }) {
  const [filter, setFilter] = useState("all");
  const filtered = filter === "all" ? history : history.filter((h) => h.type === filter);
  const chips = [
    { id: "all", label: "Barchasi" },
    { id: "rental", label: "Ijara" },
    { id: "logistics", label: "Logistika" },
    { id: "warehouse", label: "Ombor" },
  ];

  return (
    <div>
      <SectionHeader title="Buyurtmalar tarixi" subtitle="Barcha so'rov va bronlaringiz shu yerda" t={t} />
      <div className="flex gap-2 overflow-x-auto px-5 pb-1">
        {chips.map((c) => {
          const active = filter === c.id;
          return (
            <button key={c.id} onClick={() => setFilter(c.id)}
              className={`shrink-0 rounded-full px-3.5 py-1.5 text-xs font-semibold transition-colors ${active ? "text-white" : `${t.subtext} ${t.chip}`}`}
              style={{ backgroundColor: active ? BRAND_GREEN : undefined }}>
              {c.label}
            </button>
          );
        })}
      </div>
      <div className="mt-4 space-y-3 px-5">
        {filtered.length === 0 && (
          <div className={`rounded-2xl border border-dashed ${t.cardBorder} px-5 py-10 text-center`}>
            <Icon name="History" size={28} className={`mx-auto ${t.faint}`} />
            <p className={`mt-3 text-sm ${t.subtext}`}>Bu toifada hali buyurtma yo'q</p>
          </div>
        )}
        {filtered.map((h, i) => {
          const meta = HISTORY_TYPE_META[h.type];
          return (
            <div key={h.id} className={`ferdo-anim rounded-2xl border ${t.cardBorder} ${t.card} p-4`} style={{ animation: "ferdoSlideUp 0.3s ease-out both", animationDelay: `${i * 50}ms` }}>
              <div className="flex items-start justify-between gap-3">
                <div className="flex items-center gap-3">
                  <div className="flex h-11 w-11 items-center justify-center rounded-xl" style={{ backgroundColor: meta.color + "22" }}>
                    <Icon name={meta.icon} size={18} color={meta.color} />
                  </div>
                  <div>
                    <h3 className={`text-sm font-semibold ${t.text}`}>{h.title}</h3>
                    <p className={`text-xs ${t.subtext}`}>{h.subtitle}</p>
                  </div>
                </div>
                <span className="whitespace-nowrap rounded-full px-2.5 py-1 text-[11px] font-semibold"
                  style={{ backgroundColor: h.status === "Yakunlangan" ? BRAND_GREEN + "1F" : BRAND_AMBER + "26", color: h.status === "Yakunlangan" ? BRAND_GREEN : "#A9761E" }}>
                  {h.status}
                </span>
              </div>
              <div className={`mt-3 flex items-center justify-between border-t ${t.divider} pt-2.5`}>
                <span className={`flex items-center gap-1.5 text-xs ${t.faint}`}><Icon name="Clock3" size={13} /> {h.when}</span>
                {h.amount !== undefined && <span className={`text-sm font-bold ${t.text}`}>{formatSum(h.amount)}</span>}
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

/* -------------------------------- Bottom nav -------------------------------- */
function BottomNav({ tab, setTab, t }) {
  const items = [
    { id: "rental", label: "Texnika", icon: "Tractor" },
    { id: "logistics", label: "Logistika", icon: "Truck" },
    { id: "warehouse", label: "Ombor", icon: "Warehouse" },
    { id: "history", label: "Tarix", icon: "History" },
  ];
  return (
    <nav className={`fixed inset-x-0 bottom-0 z-40 mx-auto flex max-w-md items-center justify-around border-t ${t.navBorder} ${t.navBg} px-1 pb-[calc(env(safe-area-inset-bottom,0px)+8px)] pt-2 backdrop-blur-md`}>
      {items.map((item) => {
        const active = tab === item.id;
        return (
          <button key={item.id} onClick={() => setTab(item.id)} className="flex flex-1 flex-col items-center gap-1 rounded-2xl py-1.5 transition-colors">
            <span className="flex h-9 w-12 items-center justify-center rounded-full transition-colors" style={{ backgroundColor: active ? BRAND_GREEN : "transparent" }}>
              <Icon name={item.icon} size={20} color={active ? "white" : undefined} className={active ? "" : t.faint} />
            </span>
            <span className={`text-[11px] font-medium ${active ? "" : t.faint}`} style={active ? { color: BRAND_GREEN } : undefined}>{item.label}</span>
          </button>
        );
      })}
    </nav>
  );
}

function TopBar({ dark, setDark, t }) {
  return (
    <div className={`sticky top-0 z-30 flex items-center justify-between border-b ${t.navBorder} ${t.navBg} px-5 pb-3 pt-[calc(env(safe-area-inset-top,0px)+12px)] backdrop-blur-md`}>
      <div className="flex items-center gap-2">
        <span className="flex h-8 w-8 items-center justify-center rounded-xl text-white" style={{ backgroundColor: BRAND_GREEN }}><Icon name="Sprout" size={17} color="white" /></span>
        <span className={`text-base font-extrabold tracking-tight ${t.text}`}>FERDO</span>
      </div>
      <button onClick={() => setDark(!dark)} className={`flex h-8 w-8 items-center justify-center rounded-full ${t.chip}`} aria-label="Mavzuni almashtirish">
        <Icon name={dark ? "Sun" : "Moon"} size={16} className={t.text} />
      </button>
    </div>
  );
}

function FerdoApp() {
  const [dark, setDark] = useState(false);
  const [tab, setTab] = useState("rental");
  const [toast, setToast] = useState(null);
  const [history, setHistory] = useState(INITIAL_HISTORY);

  useEffect(() => {
    if (typeof window !== "undefined" && window.matchMedia) {
      setDark(window.matchMedia("(prefers-color-scheme: dark)").matches);
    }
  }, []);

  const showToast = (msg) => { setToast(msg); window.setTimeout(() => setToast(null), 2600); };
  const addHistory = (entry) => {
    setHistory((prev) => [{ ...entry, id: `h${Date.now()}`, when: "Hozir", status: "Kutilmoqda" }, ...prev]);
  };
  const t = dark ? DARK : LIGHT;

  return (
    <div className={`mx-auto min-h-screen w-full max-w-md ${t.appBg} sm:my-4 sm:min-h-[812px] sm:rounded-[36px] sm:border sm:${t.cardBorder} sm:shadow-2xl`}>
      <TopBar dark={dark} setDark={setDark} t={t} />
      <main className="pb-28 pt-2">
        {tab === "rental" && <RentalPage t={t} showToast={showToast} addHistory={addHistory} />}
        {tab === "logistics" && <LogisticsPage t={t} showToast={showToast} addHistory={addHistory} />}
        {tab === "warehouse" && <WarehousePage t={t} showToast={showToast} addHistory={addHistory} />}
        {tab === "history" && <HistoryPage t={t} history={history} />}
      </main>
      <p className={`px-5 pb-4 text-[10px] leading-snug ${t.faint}`}>Rasm manbalari: Wikimedia Commons (CC BY-SA / ochiq litsenziyalar) va Unsplash.</p>
      <BottomNav tab={tab} setTab={setTab} t={t} />
      {toast && <Toast message={toast} t={t} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<FerdoApp />);
</script>
</body>
</html>
